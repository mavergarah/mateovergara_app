version: "2"
services:
  nginx:
    image: nginx:1.15.2
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - ./mateovergara_app:/app

  postgres:
    image: postgres:12
    env_file: .env

  app:
    image: mateovergara_web
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./mateovergara_app:/app
    env_file: .env
    restart: on-failure
    command: python manage.py runserver 0.0.0.0:8000
