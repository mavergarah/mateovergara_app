version: "2"
services:
  nginx:
    extends:
      file: base.yml
      service: nginx
    links:
      - app
    ports:
      - "5000:5000"

    postgres:
      extends:
        file: base.yml
        service: postgres
      volumes:
        - ./db-data:/var/lib/postgresql/data/

    app:
      extends:
        file: base.yml
      service:
        app
      environment:
        - DJANGO_SETTINGS_MODULE=service.settings.prod_settings
      command: python manage.py runserver 0.0.0.0:8000
      build:
        args:
          - DJANGO_ENV=prod
      links:
        - postgres
