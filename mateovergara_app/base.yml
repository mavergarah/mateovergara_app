services:
  nginx:
    image: nginx:1.27.2
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - ./app:/app

  postgres:
    image: postgres:17.1
    env_file: .env

  app:
    image: mateo_web
    build: ./
    volumes:
      - ./mateovergara_app:/app
    env_file: .env
    restart: on-failure
    command: sh ./scripts/dev.sh
