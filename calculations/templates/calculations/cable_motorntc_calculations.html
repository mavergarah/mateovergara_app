{% extends "calculations/index.html" %}

{% block title %}Conductores{% endblock %}

{% block content %}
<!-- Esta plantilla le permite al usuario ingresar los datos
para el cálculo del conductor de un motor basado en el artículo
430 de la NTC 2050 -->
<br>
<div class="container">
  <div class="row">
    <div class="col-lg-12">
      <div class="section-heading">
        <h2>Cálculo de Conductores Eléctricos</h2>
        <form class="" action="cable_motorntc_result" method="post">
        {% csrf_token %}
        <div class="row">
          <div class="col-lg-5">
            <fieldset>
              <label for="mon_power">¿Potencia del motor (HP)?</label>
              <select name="mon_power">
                  <option value="potencia">- </option>
                  <option value="0.5">1/2</option>
                  <option value="0.75">3/4</option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="5">5</option>
                  <option value="7.5">7.5</option>
                  <option value="10">10</option>
                  <option value="15">15</option>
                  <option value="20">20</option>
                  <option value="25">25</option>
                  <option value="30">30</option>
                  <option value="40">40</option>
                  <option value="50">50</option>
                  <option value="60">60</option>
                  <option value="75">75</option>
                  <option value="100">100</option>
                  <option value="125">125</option>
                  <option value="150">150</option>
                  <option value="200">200</option>
                  <option value="250">250</option>
                  <option value="300">300</option>
                  <option value="350">350</option>
                  <option value="400">400</option>
                  <option value="450">450</option>
                  <option value="500">500</option>
              </select>
            </fieldset>
          </div>
          <div class="col-lg-5">
            <fieldset>
              <label for="mon_voltage">¿Nivel de tensión (V)?</label>
              <select name="mon_voltage">
                  <option value="tension">- </option>
                  <option value="115">115</option>
                  <option value="200">200</option>
                  <option value="208">208</option>
                  <option value="230">230</option>
                  <option value="460">460</option>
                  <option value="575">575</option>
                  <option value="2300">2300</option>
              </select>
            </fieldset>
          </div>
          <div class="col-lg-5">
            <fieldset>
              <label for="mon_sinchronous">¿Síncrono o asíncrono?</label>
              <select name="mon_sinchronous">
                  <option value="sincrono">- </option>
                  <option value="NTC2050-As">Asíncrono</option>
                  <option value="NTC2050-Si">Síncrono</option>
              </select>
            </fieldset>
          </div>
          <div class="col-lg-5">
            <fieldset>
              <label for="mon_fases">¿Cuántas Fases?</label>
              <select name="mon_fases">
                  <option value="fases">- </option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
              </select>
            </fieldset>
          </div>
          <div class="col-lg-5">
            <fieldset>
              <label for="mon_longitud">Longitud (m):</label>
              <input type="text" name="mon_longitud" value="15">
            </fieldset>
          </div>
          <div class="col-lg-5">
            <fieldset>
              <label for="mon_temperature">Temp. Ambiente (ºC):</label>
              <input type="text" name="mon_temperature" value="25">
            </fieldset>
          </div>
          <div class="col-lg-5">
            <fieldset>
              <label for="mon_fases">¿Temp. Conductor (ºC)?</label>
              <select class="select-form" name="mon_temp-conductor">
                  <option value="temperatura">- </option>
                  <option value="60">60</option>
                  <option value="75">75</option>
                  <option value="90">90</option>
              </select>
            </fieldset>
          </div>
          <div class="col-lg-5">
            <fieldset>
              <label for="mon_carga_continua">¿Carga continua?</label>
              <select name="mon_carga_continua">
                  <option value="carga continua">- </option>
                  <option value="y">Sí</option>
                  <option value="n">No</option>
              </select>
            </fieldset>
          </div>
          <div class="col-lg-5">
            <fieldset>
              <label for="mon_carga_continua">¿Material del conductor?</label>
              <select class="select-form" name="mon_material">
                  <option value="material">- </option>
                  <option value="Cu">Cobre</option>
                  <option value="Al">Aluminio</option>
                  <option value="Al-cu">Aluminio recubierto de cobre</option>
              </select>
            </fieldset>
          </div>
          <div class="col-lg-5">
            <fieldset>
              <label for="mon_numero-conductores">Número de conductores en una misma canalización:</label>
              <input type="text" name="mon_numero-conductores" value="3">
            </fieldset>
          </div>
          <div class="col-lg-5">
            <fieldset>
              <label for="mon_conduit">¿Tipo de Conduit?</label>
              <select name="mon_conduit">
                  <option value="conduit">- </option>
                  <option value="PVC">PVC</option>
                  <option value="St">Acero</option>
              </select>
            </fieldset>
          </div>
          <div class="col-lg-10">
            <fieldset>
              <input type="submit" name="mon_calcular" value="Calcular">
            </fieldset>
          </div>
          <div class="col-lg-10">
            <fieldset>
              <label class="label-form-error" for="mon_numero-conductores">{{ error }}</label>
            </fieldset>
          </div>
        </div>
        <div class="col-log-10">
          <fieldset>
            <h6><a href="#">¿Necesitas ayuda?</a></h6>
          </fieldset>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Notas para que el usuario pueda hacer uso de la aplicación -->

{% endblock %}
