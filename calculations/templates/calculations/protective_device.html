{% extends "calculations/index.html" %}

{% block title %}Dispositivo de Protección{% endblock %}

{% block content %}
<br>
<div class="subscribe">
<div class="container">
  <div class="row">
    <div class="col-lg-12">
      <div class="section-heading">
        <h2>Selección del Dispositivo de Protección</h2>
        <form action="protective_result" method="post">
        {% csrf_token %}
        <!-- Se ingresan las variables para el cálculo del dispositivo de protección
        por parte del usuario -->
        <div class="row">
          <div class="col-lg-5">
            <fieldset>
              <label for="pro_current_ad">Corriente Ajustada (A):</label>
              <input type="text" name="pro_current_ad" value="16">
            </fieldset>
          </div>
          <div class="col-lg-5">
            <fieldset>
              <label for="pro_current_cont">Corriente Continua (A):</label>
              <input type="text" name="pro_current_cont" value="13">
            </fieldset>
          </div>
          <div class="col-lg-10">
            <fieldset>
              <input type="submit" name="ca_calcular" value="Calcular">
            </fieldset>
          </div>
          <div class="col-lg-10">
            <label for="ca_calcular">{{ error }}</label>
          </div>
        </div>
        <div class="row">
          <fieldset>
            <h6><a href="#">¿Necesitas ayuda?</a></h6>
          </fieldset>
        </div>
        </form>
      </div>
    </div>
  </div>
</div>
</div>
{% endblock %}
