{% extends "calculations/index.html" %}

{% block title %}Conductor de protección{% endblock %}

{% block content %}
<!-- Ingreso de datos para el cálculo de conductor de puesta a Tierra
de equipos -->
<br>
<div class="subscribe">
<div class="container">
  <div class="row">
    <div class="col-lg-12">
      <div class="section-heading">
        <form class="" action="grounding_result" method="post">
        {% csrf_token %}
        <h2>Cálculo del Conductor de Protección</h2>
        <div class="row">
          <div class="col-lg-5">
            <fieldset>
              <label for="gro_ingreso">Protección (A):</label>
              <input name="gro_ingreso" value="Protección (A)">
            </fieldset>
          </div>
          <div class="col-lg-5">
            <fieldset>
              <label for="gro_diametro">¿Material del conductor?</label>
              <select name="gro_diametro">
                  <option value="material">- </option>
                  <option value="Cu">Cu</option>
                  <option value="Al">Al</option>
              </select>
            </fieldset>
          </div>
          <div class="col-lg-10">
            <fieldset>
              <input type="submit" name="gro_calculate" value="Calcular">
            </fieldset>
          </div>
          <div class="col-lg-10">
            <fieldset>
              <label for="method">{{ error }}</label>
            </fieldset>
          </div>
        </div>
        <div class="row">
          <div class="col-lg-10">
            <h6><a href="#">¿Necesitas ayuda?</a></h6>
          </div>
        </div>
        </form>
      </div>
    </div>
  </div>
</div>
</div>
{% endblock %}
