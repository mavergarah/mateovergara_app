{% extends "calculations/index.html" %}

{% block title %}Arc Flash{% endblock %}

{% block content %}
<br>
<div class="container">
  <div class="row">
    <div class="col-lg-12">
      <div class="section-heading">
        <form class="" action="arcflash_result" method="post">
        {% csrf_token %}
        <h2>Cálculo de Energía Incidente</h2>
        <div class="row">
          <div class="col-lg-5">
            <fieldset>
              <label for="ar_voltage">Tensión (V):</label>
              <input type="text" name="ar_voltage" value="220">
            </fieldset>
          </div>
          <div class="col-lg-5">
            <fieldset>
              <label for="ar_short_circuit_current">Corriente de cortocircuito trifáisco - F (kA):</label>
              <input type="text" name="ar_short_circuit_current" value="0.7">
            </fieldset>
          </div>
          <div class="col-lg-5">
            <fieldset>
              <label for="ar_time">Tiempo de despeje de falla - t (s):</label>
              <input type="text" name="ar_time" value="0.01">
            </fieldset>
          </div>
          <div class="col-lg-5">
            <fieldset>
              <label for="ar_conductors_separation">Distancia del arco a la persona - D (m):</label>
              <input type="text" name="ar_distance" value="0.9">
            </fieldset>
          </div>
          <div class="col-lg-5">
            <fieldset>
              <label for="ar_panel_kind">¿Tipo de Tablero?</label>
              <select name="ar_panel_kind">
                  <option value="tablero">- </option>
                  <option value="CCM">CCM</option>
                  <option value="PP">Panel de Potencia</option>
              </select>
            </fieldset>
          </div>
          <div class="col-lg-5">
            <fieldset>
              <label for="ar_arc_kind">¿Tipo de arco?</label>
              <select name="ar_arc_kind">
                  <option value="arco">- </option>
                  <option value="O">Abierto</option>
                  <option value="C">Cerrado</option>
              </select>
            </fieldset>
          </div>
          <div class="col-lg-5">
            <fieldset>
              <label for="ar_arc_kind">¿Conexión a tierra?</label>
              <select name="ar_earth_kind">
                  <option value="tierra">- </option>
                  <option value="HR">Alta resistencia</option>
                  <option value="WR">Sin resistencia</option>
              </select>
            </fieldset>
          </div>
          <div class="col-lg-5">
            <fieldset>
              <label for="ar_conductors_separation">Separación de conductores - G (mm):</label>
              <input type="text" name="ar_conductors_separation" value="13">
            </fieldset>
          </div>
          <div class="col-lg-5">
            <fieldset>
              <label for="ar_arc_kind">¿Método de cálculo?</label>
              <select name="method">
                  <option value="metodo">- </option>
                  <option value="IE15">IEEE1584</option>
                  <option value="NFPA70E">NFPA 70E</option>
              </select>
            </fieldset>
          </div>
          <div class="col-lg-5">
            <fieldset>
              <label for="ar_conductors_separation"><a class="a-forms" href="http://127.0.0.1:8000/calculations/arcflash_gtable">(Tabla de separación de conductores)</a></label>
            </fieldset>
          </div>
          <div class="col-lg-10">
            <fieldset>
              <input type="submit" name="ar_calculate" value="Calcular">
            </fieldset>
          </div>
        </div>
        <div class="row">
          <div class="col-lg-10">
            <fieldset>
              <h6><a href="#">¿Necesitas ayuda?</a></h6>
            </fieldset>
          </div>
        </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
