{% extends "calculations/index.html" %}

{% block title %}Distancias de Seguridad{% endblock %}

{% block content %}
<!-- Se muestra el formulario al usuario para que ingrese los valores
que le permiten realizar la selección de las distancias de seguridad -->
<br>
<div class="subscribe">
<div class="container">
  <div class="row">
    <div class="col-lg-12">
      <div class="section-heading">
        <h2>Cálculo Distancias de Seguridad</h2>
        <form class="" action="safety_clearances_result" method="post">
        {% csrf_token %}
        <div class="row">
          <div class="col-lg-5">
            <fieldset>
              <label class="label-form" for="sc_voltage">Tensión entre líneas (V):</label>
              <input class="input" type="text" name="sc_voltage" value="220">
            </fieldset>
          </div>
          <div class="col-lg-5">
            <fieldset>
              <label class="label-form" for="sc_voltage">¿Sistema?</label>
              <select class="select-form" name="sc_voltage_system">
                  <option value="¿Tipo de Sistema?">- </option>
                  <option value="AC">AC</option>
                  <option value="DC">DC</option>
              </select>
            </fieldset>
          </div>
          <div class="col-lg-10">
            <fieldset>
              <input class="button-form" type="submit" name="sc_calculate" value="Calcular">
            </fieldset>
          </div>
          <div class="col-lg-10">
            <fieldset>
              <label class="label-form-error" for="method">{{ error }}</label>
            </fieldset>
          </div>
        </div>
        <div class="row">
          <fieldset>
            <h6><a href="#">¿Necesitas ayuda?</a></h6>
          </fieldset>
        </div>
        </form>
      </div>
    </div>
  </div>
</div>
</div>
{% endblock %}
