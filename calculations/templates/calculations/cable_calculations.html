{% extends "calculations/index.html" %}

{% block title %}Conductores{% endblock %}

{% block content %}
<!-- Esta plantailla le muestra al usuario el formulario para el ingreso de datos -->
<br>
<div class="subscribe">
<div class="container">
  <div class="row">
    <div class="col-lg-12">
      <div class="section-heading">
        <h2>Cálculo de Conductor de Fase, Neutro y Tierra</h2>
        <form id="cable-general-load" action="cable_result" method="post">
        {% csrf_token %}
        <!-- Se ingresan los valores necesarios para el cálculo de conductores de cargas generales -->
        <div class="row">
          <div class="col-lg-5">
            <fieldset>
              <label class="label-form" for="ca_potencia">Potencia:</label>
              <input type="text" name="ca_potencia" value="1">
            </fieldset>
          </div>
          <div class="col-lg-5">
            <fieldset>
              <label class="label-form" for="ca_unidades">¿Unidades?</label>
              <select class="select-form" name="ca_unidades">
                <option value="unidades">-</option>
                <option value="kW">kW</option>
                <option value="kVA">kVA</option>
              </select>
            </fieldset>
          </div>
          <div class="col-lg-5">
            <fieldset>
              <label class="label-form" for="ca_fp">Factor de Potencia (0 - 1):</label>
              <input type="text" name="ca_fp" value="0.85">
            </fieldset>
          </div>
          <br>
          <div class="col-lg-5">
            <fieldset>
              <label class="label-form" for="ca_tension">Tensión (V):</label>
              <input type="text" name="ca_tension" value="208">
            </fieldset>
          </div>
          <div class="col-lg-5">
            <fieldset>
              <label class="label-form" for="ca_longitud">Longitud (m):</label>
              <input type="text" name="ca_longitud" value="20">
            </fieldset>
          </div>
          <div class="col-lg-5">
            <fieldset>
              <label class="label-form" for="ca_temperature">Temp. Ambiente (ºC):</label>
              <input type="text" name="ca_temperature" value="25">
            </fieldset>
          </div>
          <div class="col-lg-5">
            <fieldset>
              <label class="label-form" for="ca_numero-conductores">Número de conductores energizados en una misma canalización:</label>
              <input type="text" name="ca_numero-conductores" value="3">
            </fieldset>
          </div>
          <div class="col-lg-5">
            <fieldset>
              <label class="label-form" for="ca_fases">¿Cuántas Fases?</label>
              <select class="select-form" name="ca_fases">
                  <option value="fases">-</option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
              </select>
            </fieldset>
          </div>
          <div class="col-lg-5">
            <fieldset>
              <label class="label-form" for="ca_temp-conductor">¿Temp. Conductor (ºC)?</label>
              <select class="select-form" name="ca_temp-conductor">
                  <option value="temperatura">- </option>
                  <option value="60">60</option>
                  <option value="75">75</option>
                  <option value="90">90</option>
              </select>
            </fieldset>
          </div>
          <div class="col-lg-5">
            <fieldset>
              <label class="label-form" for="ca_carga_continua">¿Carga continua?</label>
              <select class="select-form" name="ca_carga_continua">
                  <option value="carga continua">- </option>
                  <option value="y">Sí</option>
                  <option value="n">No</option>
              </select>
            </fieldset>
          </div>
          <div class="col-lg-5">
            <fieldset>
              <label class="label-form" for="ca_material">¿Material del conductor?</label>
              <select class="select-form" name="ca_material">
                  <option value="material">- </option>
                  <option value="Cu">Cobre (Cu)</option>
                  <option value="Al">Aluminio (Al)</option>
                  <option value="Al-cu">Aluminio recubierto de cobre</option>
              </select>
            </fieldset>
          </div>
          <div class="col-lg-5">
            <fieldset>
              <label class="label-form" for="ca_conduit">¿Tipo de Conduit?</label>
              <select class="select-form" name="ca_conduit">
                  <option value="conduit">- </option>
                  <option value="PVC">PVC</option>
                  <option value="St">Acero</option>
              </select>
            </fieldset>
          </div>
        </div>
        <div class="col-lg-10">
          <fieldset>
            <input class="main-dark-button" type="submit" name="ca_calculate" value="Calcular">
          </fieldset>
        </div>
        <div class="col-lg-12">
          <label class="label-form-error" for="ca_numero-conductores">{{ error }}</label>
        </div>
        <div class="col-log-10">
          <fieldset>
            <h6><a href="#">¿Necesitas ayuda?</a></h6>
          </fieldset>
        </div>
        </form>
      </div>
    </div>
  </div>
</div>
</div>
{% endblock %}
